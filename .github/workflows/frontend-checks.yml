name: Frontend checks

on:
  pull_request:
    branches:
      - develop

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Tests
        run: npm test
      - name: Lint
        run: npm run lint

  backend-smoke:
    name: Live backend anonymous API smoke
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check deployed backend API responses and local CORS
        run: |
          python3 - <<'PY'
          import json
          import urllib.error
          import urllib.request
          import sys

          base = "https://hansul-server.vercel.app"
          checks = [
              ("/api/health", "status"),
              ("/api/home?limit=6", "top_recipes"),
              ("/api/recipes?sort=popular&limit=6", "recipes"),
              ("/api/search/recipes?q=jjimdak&limit=6", "recipes"),
              ("/api/map/regions", "regions"),
              ("/api/map/regions/47170/recipes?limit=6", "recipes"),
          ]
          errors = 0
          for path, field in checks:
              try:
                  with urllib.request.urlopen(
                      urllib.request.Request(base + path, headers={"Accept": "application/json"}),
                      timeout=30
                  ) as response:
                      content = json.load(response)
                      assert isinstance(content, dict), "expected JSON object"
                      if field == "status":
                          assert content.get(field) == "ok", f"status={content.get(field)!r}"
                      else:
                          assert isinstance(content.get(field), list), f"{field} not an array"
                      print(f"PASS {path}: HTTP {response.status}; {field} valid", flush=True)
              except Exception as exc:
                  errors += 1
                  print(f"FAIL {path}: {type(exc).__name__}: {exc}", flush=True)
                  if isinstance(exc, urllib.error.HTTPError):
                      print(f"  error body: {exc.read(500).decode('utf-8', errors='replace')}", flush=True)
          try:
              request = urllib.request.Request(
                  base + "/api/health",
                  method="OPTIONS",
                  headers={
                      "Origin": "http://localhost:5173",
                      "Access-Control-Request-Method": "POST",
                      "Access-Control-Request-Headers": "authorization,content-type"
                  }
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  allowed = response.headers.get("Access-Control-Allow-Origin")
                  print(f"CORS preflight: HTTP {response.status}, allow-origin={allowed!r}", flush=True)
                  if allowed not in ("*", "http://localhost:5173"):
                      print("WARNING: direct localhost:5173 -> backend browser requests may be blocked by CORS; configure Vite proxy for local development", flush=True)
          except Exception as exc:
              print(f"WARNING: CORS preflight check could not complete: {exc}", flush=True)
          try:
              with urllib.request.urlopen(urllib.request.Request(
                  base + "/api/health",
                  headers={"Origin": "http://localhost:5173", "Accept": "application/json"}
              ), timeout=30) as response:
                  print(f"CORS GET: HTTP {response.status}, allow-origin={response.headers.get('Access-Control-Allow-Origin')!r}", flush=True)
          except Exception as exc:
              print(f"WARNING: CORS GET diagnostic unavailable: {exc}", flush=True)
          sys.exit(1 if errors else 0)
          PY

  production-login-config-smoke:
    name: Diagnose production login frontend configuration
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect public deployed JS configuration and browser preflights (never log keys)
        run: |
          python3 - <<'PY'
          import re
          import urllib.parse
          import urllib.error
          import urllib.request

          site = "https://hansul-client.vercel.app"
          backend = "https://hansul-server.vercel.app"

          def retrieve(url, headers=None, method="GET"):
              req = urllib.request.Request(url, headers=headers or {}, method=method)
              try:
                  with urllib.request.urlopen(req, timeout=25) as res:
                      return res.status, res.headers.get("Content-Type", ""), res.headers, res.read(7_000_000)
              except urllib.error.HTTPError as exc:
                  return exc.code, exc.headers.get("Content-Type", ""), exc.headers, exc.read(1024)

          try:
              status, typ, _, html = retrieve(site)
              print(f"Deployment homepage: HTTP {status}; content-type={typ}", flush=True)
              scripts = re.findall(r'<script[^>]+src=["\\\']([^"\\\']+\\.js(?:\\?[^"\\\']*)?)["\\\']', html.decode("utf-8", errors="replace"), flags=re.I)
              print(f"JS entry scripts found: {len(scripts)}", flush=True)
              js = b""
              for script in scripts[:4]:
                  url = urllib.parse.urljoin(site, script)
                  code, mime, _, body = retrieve(url)
                  print(f"JS entry: HTTP {code}, content-type={mime}, bytes={len(body)}", flush=True)
                  if code == 200:
                      js += body
              if js:
                  print("DEPLOYED CONFIG CHECK:", flush=True)
                  print("  expected Supabase project URL present:", b"ksshvrioacbqnzoalgeb.supabase.co" in js, flush=True)
                  print("  publishable Supabase key prefix present:", b"sb_publishable_" in js, flush=True)
                  print("  production backend URL present:", b"hansul-server.vercel.app" in js, flush=True)
                  print("  any Supabase URL present:", bool(re.search(rb'https?://[a-z0-9-]+\\.supabase\\.co', js)), flush=True)
              else:
                  print("No readable JS bundle found; cannot inspect client config", flush=True)
          except Exception as exc:
              print(f"Deployment check error: {type(exc).__name__}: {exc}", flush=True)

          for path in ("/login", "/api/profiles/me"):
              try:
                  status, typ, _, _ = retrieve(site + path)
                  print(f"Frontend {path}: HTTP {status}, content-type={typ}", flush=True)
              except Exception as exc:
                  print(f"Frontend {path}: {type(exc).__name__}: {exc}", flush=True)

          headers = {
              "Origin": site,
              "Access-Control-Request-Method": "GET",
              "Access-Control-Request-Headers": "authorization,content-type"
          }
          try:
              status, _, res_headers, _ = retrieve(backend + "/api/profiles/me", headers=headers, method="OPTIONS")
              print(f"Backend preflight from production origin: HTTP {status}; allow-origin={res_headers.get('Access-Control-Allow-Origin')!r}; allow-headers={res_headers.get('Access-Control-Allow-Headers')!r}", flush=True)
          except Exception as exc:
              print(f"Backend preflight error: {type(exc).__name__}: {exc}", flush=True)
          PY
